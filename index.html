<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>배포 연습실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 상단 연습 표시줄 + 가상 브라우저(주소창) + 저장소 서비스 화면 재현 + 오른쪽 아래 코치 패널. 의도적으로 밝은 단일 테마 */
:root{
  color-scheme:light;
  --fg:#1f2328; --muted:#59636e; --line:#d1d9e0; --line2:#d1d9e0b3; --sub:#f6f8fa; --bg:#ffffff;
  --link:#0969da; --green:#1f883d; --green-h:#1a7f37; --red:#d1242f; --yellow:#9a6700; --yellow-bg:#fff8c5;
  --blue-bg:#ddf4ff; --green-bg:#dafbe1; --red-bg:#ffebe9;
  --coach:#dc2626; --coach-soft:#fef2f2; --ink:#1b1f24;
  --f-ui:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,"Pretendard","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-kr:"Pretendard","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-ui);font-size:14px;line-height:1.5;word-break:keep-all;overflow-wrap:break-word}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;white-space:nowrap;user-select:none;-webkit-user-select:none}
button:focus,input:focus,textarea:focus{outline:none}
button:focus-visible,[data-act]:focus-visible{box-shadow:0 0 0 2px var(--link)}
a{color:var(--link);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
svg{flex:none;vertical-align:middle}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}

/* practice bar */
.pbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--ink);color:#fff;font-family:var(--f-kr);display:flex;align-items:center;gap:10px;padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:13px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--ink)}
.pbar .tag{background:var(--coach);padding:2px 8px;border-radius:4px;font-weight:700;font-size:12px;white-space:nowrap}
.pbar .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;opacity:.85}
.chrome{display:flex;align-items:center;gap:6px;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:#e9ecef;border-bottom:1px solid var(--line)}
.chrome .nb{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.chrome .nb:hover{background:#dfe3e7}
.chrome .nb:disabled{opacity:.35;cursor:default;background:none}
.addr{flex:1;min-width:0;background:#fff;border-radius:16px;padding:5px 14px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.addr b{color:var(--fg);font-weight:500}

/* site header */
.hd{display:flex;align-items:center;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));background:var(--sub);position:relative}
.hd.repo{padding-bottom:6px}
.ib{width:32px;height:32px;border:1px solid var(--line);border-radius:6px;display:inline-grid;place-items:center;color:var(--muted);background:var(--bg)}
.ib:hover{background:var(--sub)}
.mark{width:32px;height:32px;border-radius:50%;display:block;color:var(--fg);--dog-bg:#fff;flex:none;padding:0}
.mark.inv{color:#fff;--dog-bg:#0b0e3a}
.crumb{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.crumb a{color:var(--fg)}
.crumb .sep{color:var(--muted);font-weight:400;margin:0 2px}
.sp{flex:1}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:4px 8px;color:var(--muted);font-size:13px;background:var(--bg);min-width:200px;white-space:nowrap}
.plusbtn{display:inline-flex;gap:2px;width:auto;padding:0 6px}
.ava{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#8fb3ec,#4b6cb7);flex:none;border:1px solid var(--line);color:#fff;font-weight:700;display:grid;place-items:center;font-size:13px;text-transform:uppercase}
.rtabs{display:flex;gap:4px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));background:var(--sub);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.rtabs::-webkit-scrollbar{display:none}
.rtab{display:inline-flex;align-items:center;gap:6px;padding:8px 8px 10px;font-size:14px;color:var(--fg);border-bottom:2px solid transparent;border-radius:0}
.rtab:hover{background:#eaeef2;border-radius:6px 6px 0 0}
.rtab.on{border-bottom-color:#fd8c73;font-weight:600}
.cnt{background:#818b981f;border-radius:99px;padding:0 6px;font-size:12px;font-weight:500}

/* menus */
.menu{position:absolute;z-index:30;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(66,74,83,.18);padding:8px;min-width:200px}
.menu .mi{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;width:100%;text-align:left;font-size:14px}
.menu .mi:hover{background:#818b9826}
.menu .mi.dis{color:var(--muted);cursor:default}
.menu .mi.dis:hover{background:none}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px -8px}
.menu .mh{font-size:12px;color:var(--muted);padding:4px 8px;font-weight:600}
.menu .ck{width:16px;display:inline-grid;place-items:center}

/* common */
.wrap{max-width:1280px;margin:0 auto;padding-block:24px 160px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.narrow{max-width:760px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--sub);font-size:14px;font-weight:500;color:var(--fg)}
.btn:hover{background:#eff2f5}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn.green{background:var(--green);border-color:#1f232826;color:#fff;font-weight:600}
.btn.green:hover{background:var(--green-h)}
.btn.danger{color:var(--red)}
.btn.danger:hover{background:var(--red);color:#fff;border-color:var(--red)}
.btn:disabled,.btn.green:disabled{opacity:.5;cursor:not-allowed;background:var(--sub);color:var(--muted);border-color:var(--line)}
.btn.green:disabled{background:#94d3a2;color:#fff;border-color:#1f232826}
.in{font:inherit;font-size:14px;height:32px;padding:5px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);width:100%}
.in:focus{border-color:var(--link);box-shadow:inset 0 0 0 1px var(--link)}
textarea.in{height:auto;min-height:80px;resize:vertical}
.in:disabled{background:var(--sub);color:var(--muted)}
.lbl{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.req{color:var(--red)}
.note{font-size:12px;color:var(--muted);margin-top:4px}
.ok{color:var(--green);font-size:12px;font-weight:600;display:flex;gap:4px;align-items:center;margin-top:4px}
.err{color:var(--red);font-size:12px;margin-top:4px}
.box{border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.box-h{padding:12px 16px;background:var(--sub);border-bottom:1px solid var(--line);border-radius:6px 6px 0 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row{display:flex;align-items:center;gap:10px;padding:8px 16px;border-top:1px solid var(--line2);min-width:0}
.row:first-child{border-top:0}
.h1{font-size:24px;font-weight:400;margin:0}
.h2{font-size:20px;font-weight:600;margin:0}
.h3{font-size:16px;font-weight:600;margin:0}
.divider{border:0;border-top:1px solid var(--line);margin:16px 0}
.pill{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px;padding:0 7px;font-size:12px;font-weight:500;color:var(--muted);line-height:18px}
.flash{padding:16px 20px;border:1px solid;border-radius:6px;display:flex;gap:10px;align-items:center;margin-bottom:16px}
.flash.ok{background:var(--green-bg);border-color:#4ac26b66;color:var(--fg);font-size:14px;font-weight:400;margin-top:0}
.flash.info{background:var(--blue-bg);border-color:#54aeff66}
.flash.warn{background:var(--yellow-bg);border-color:#d4a72c66}
.flash.bad{background:var(--red-bg);border-color:#ff818266}
.radio{display:flex;gap:10px;align-items:flex-start;padding:10px 0;cursor:pointer}
.radio input{margin-top:4px;accent-color:var(--link)}
.radio small{display:block;color:var(--muted);font-size:12px}
.sel{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--sub);font-weight:500}
.sel:hover{background:#eff2f5}
.relbox{position:relative;display:inline-block}

/* login */
.login{min-height:calc(100vh - 90px);display:flex;flex-direction:column;align-items:center;padding:32px 16px 140px;gap:16px;background:var(--bg)}
.login .card{width:100%;max-width:340px;border:1px solid var(--line);border-radius:6px;padding:16px;background:var(--sub);display:flex;flex-direction:column;gap:14px}
.login .alt{width:100%;max-width:340px;border:1px solid var(--line);border-radius:6px;padding:16px;text-align:center;font-size:14px}
.login h1{font-size:24px;font-weight:300;margin:0;letter-spacing:-.5px}
.bigmark{width:48px;height:48px}
/* landing */
.land{background:linear-gradient(180deg,#05062b 0%,#0b0e48 45%,#3a2b8f 85%,#5b45c4 100%);color:#fff;min-height:calc(100vh - 90px);display:flex;flex-direction:column;overflow:hidden}
.land-h{display:flex;align-items:center;justify-content:space-between;padding:20px max(20px,env(safe-area-inset-right,0px)) 20px max(20px,env(safe-area-inset-left,0px))}
.land-h .ham{color:#fff}
.land-h .sib{border:1px solid #ffffff55;border-radius:8px;padding:8px 18px;font-size:16px;color:#fff}
.land-h .sib:hover{background:#ffffff14}
.land-b{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding:72px 24px 0;gap:22px;font-family:var(--f-kr)}
.land-b h1{font-size:clamp(36px,8vw,64px);line-height:1.18;margin:0;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.land-b p{font-size:clamp(16px,2.4vw,20px);line-height:1.6;margin:0;max-width:560px;opacity:.92}
.signup{width:100%;max-width:520px;background:linear-gradient(180deg,#f4f5f8,#d9dbe6);border-radius:10px;padding:5px;display:flex;flex-direction:column;gap:5px}
.signup input{font:inherit;font-size:17px;border:0;background:transparent;padding:14px 18px;color:#1f2328}
.signup input::placeholder{color:#4a4f5a}
.signup button{background:#0a8a2f;color:#fff;font-size:18px;font-weight:600;padding:15px;border-radius:7px}
.signup button:hover{background:#0b7a2b}
.land-out{width:100%;max-width:520px;border:1px solid #ffffff99;border-radius:10px;padding:15px;font-size:17px;color:#fff}
.land-out:hover{background:#ffffff10}
.editor{width:min(920px,96%);margin:40px auto 0;border:1px solid #8b7cf0;border-bottom:0;border-radius:24px 24px 0 0;padding:14px 14px 0;background:#ffffff0d}
.editor-in{background:#0d1117;border-radius:12px 12px 0 0;text-align:left;font-family:var(--f-mono);font-size:13px;overflow:hidden}
.ed-tabs{display:flex;gap:2px;background:#010409;overflow-x:auto}
.ed-tabs span{padding:9px 16px;color:#9198a1;white-space:nowrap;font-family:var(--f-ui);font-size:13px}
.ed-tabs span.on{background:#0d1117;color:#e6edf3}
.ed-code{padding:14px 0;line-height:1.8;color:#e6edf3;white-space:pre;overflow-x:auto}
.ed-code i{display:inline-block;width:44px;text-align:right;padding-right:16px;color:#6e7681;font-style:normal}
.ed-code .c{color:#8b949e}.ed-code .k{color:#ff7b72}.ed-code .s{color:#a5d6ff}.ed-code .t{color:#7ee787}
/* login */
.lg2{background:#fff;display:flex;flex-direction:column;align-items:center;padding:44px 20px 0;min-height:calc(100vh - 90px)}
.lg2 .wrapf{width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px}
.lg2 h1{font-size:26px;font-weight:300;margin:12px 0 18px;text-align:center;display:flex;gap:8px;justify-content:center;align-items:center}
.lg2 .lab{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;margin-bottom:8px}
.lg2 .in{height:46px;font-size:16px}
.lg2 .go{height:46px;font-size:16px;width:100%;border-radius:6px}
.orline{display:flex;align-items:center;gap:16px;color:var(--fg);margin:6px 0}
.orline::before,.orline::after{content:"";flex:1;border-top:1px solid var(--line)}
.sso{display:flex;align-items:center;justify-content:center;gap:12px;height:46px;border:1px solid var(--line);border-radius:6px;background:var(--sub);font-size:16px;width:100%}
.sso:hover{background:#eff2f5}
.sso .gi{width:20px;height:20px;border-radius:50%;border:2px solid #59636e;display:grid;place-items:center;font-size:11px;font-weight:800;color:#59636e}
.lg2 .links{text-align:center;display:flex;flex-direction:column;gap:14px;font-size:16px;margin-top:10px}
.lg2 .foot{width:calc(100% + 40px);margin-top:40px;background:var(--sub);display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px 16px 160px;color:var(--muted);font-size:15px}
.code-boxes{display:flex;gap:6px;justify-content:center}
.code-boxes span{width:36px;height:40px;border:1px solid var(--line);border-radius:6px;background:var(--bg);display:grid;place-items:center;font-family:var(--f-mono);font-size:18px;font-weight:600}

/* dashboard */
.dash{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 140px)}
.dash aside{border-right:1px solid var(--line);padding:24px 16px;background:var(--bg);display:flex;flex-direction:column;gap:10px}
.dash main{background:var(--sub);padding:24px 32px 160px;min-width:0}
.dash .feed{max-width:720px;display:flex;flex-direction:column;gap:12px}
.skel{height:10px;border-radius:4px;background:#e4e8ec}
.repoli{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;padding:4px 0}

/* repo */
.rgrid{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:24px}
.rside{display:flex;flex-direction:column;gap:16px}
.rside .sec{border-bottom:1px solid var(--line);padding-bottom:16px;display:flex;flex-direction:column;gap:8px}
.ftable .row{padding:8px 16px}
.ftable .row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftable .row .msg{flex:1;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ftable .row .tm{color:var(--muted);white-space:nowrap;font-size:13px}
.quick{background:var(--blue-bg);border:1px solid #54aeff66;border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:10px}
.codebox{font-family:var(--f-mono);font-size:12px;background:var(--sub);border:1px solid var(--line);border-radius:6px;padding:12px 16px;white-space:pre;overflow-x:auto;color:var(--fg)}

/* upload */
.drop{border:1px dashed var(--line);border-radius:6px;padding:48px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--bg);transition:.15s}
.drop.over{background:var(--blue-bg);border-color:var(--link)}
.drop .big{font-size:20px;font-weight:600}
.helper{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:var(--f-kr);background:var(--coach-soft);border:1px dashed var(--coach);border-radius:8px;padding:10px 12px;font-size:13px}
.helper b{color:var(--coach)}
.hbtn{font-family:var(--f-kr);font-weight:600;font-size:13px;padding:5px 10px;border-radius:6px;background:var(--coach);color:#fff}
.hbtn.ghost{background:transparent;color:var(--coach);border:1px solid var(--coach)}
.av{display:flex;gap:16px;align-items:flex-start}

/* settings */
.sgrid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px}
.snav{display:flex;flex-direction:column;gap:2px}
.snav .g{font-size:12px;font-weight:600;color:var(--muted);padding:12px 8px 4px;border-top:1px solid var(--line);margin-top:8px}
.snav .g:first-of-type{border-top:0;margin-top:0}
.snav .it{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:14px;text-align:left;width:100%;position:relative}
.snav .it:hover{background:#818b981a}
.snav .it.on{background:#818b981a;font-weight:600}
.snav .it.on::before{content:"";position:absolute;left:-8px;top:6px;bottom:6px;width:4px;border-radius:6px;background:var(--link)}
.subhead{border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.danger-zone{border:1px solid var(--red);border-radius:6px}
.danger-zone .row{padding:16px;justify-content:space-between;flex-wrap:wrap}
.live{border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--sub)}
.live .u{font-weight:600;word-break:break-all}

/* actions */
.agrid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px}
.st{width:16px;height:16px;flex:none;display:inline-block}
.st.run{border-radius:50%;border:2px solid #bf8700;border-top-color:transparent;animation:spin 1s linear infinite}
.st.queue{border-radius:50%;border:2px solid #bf8700;opacity:.6}
.st.ok{border-radius:50%;background:var(--green);position:relative}
.st.ok::after{content:"";position:absolute;left:5px;top:2.5px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.st.wait{border-radius:50%;border:2px solid var(--line)}
@keyframes spin{to{transform:rotate(360deg)}}
.runrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line2);cursor:pointer}
.runrow:hover{background:var(--sub)}
.graph{display:flex;align-items:center;gap:0;flex-wrap:wrap;padding:32px 24px;background:var(--sub);border-radius:0 0 6px 6px;background-image:radial-gradient(#d1d9e0 1px,transparent 1px);background-size:14px 14px}
.job{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 14px;min-width:200px;display:flex;flex-direction:column;gap:6px}
.job .t{display:flex;gap:8px;align-items:center;font-weight:600}
.edge{width:40px;height:2px;background:var(--line)}

/* site */
.site{height:calc(100vh - 90px);min-height:420px;display:flex;flex-direction:column}
.site iframe{flex:1;width:100%;border:0;background:#fff}
.p404{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:40px 16px 160px;text-align:center}
.p404 .n{font-size:96px;font-weight:700;line-height:1;color:#d0d7de;letter-spacing:-4px}
.p404 p{margin:0;max-width:520px}

/* coach */
.coach{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;width:320px;background:#fff;border:1px solid #f3c4c4;border-radius:14px;box-shadow:0 12px 32px rgba(60,10,10,.18);font-family:var(--f-kr);overflow:hidden}
.coach-h{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;background:var(--coach);color:#fff}
.coach-h b{font-size:14px}
.coach-h .p{font-size:12px;opacity:.9}
.coach-h button{margin-left:auto;font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:#ffffff26}
.coach-b{padding:12px 14px;display:flex;flex-direction:column;gap:10px;max-height:56vh;overflow:auto}

/* ---------------- state ---------------- */
const fresh=()=>({view:"intro",pin:"",screen:"landing",hist:[],loggedIn:false,user:"",menu:null,repo:null,pending:[],visited:false,flash:null,runSeq:0,runId:null,draft:{branch:null,folder:"/",source:"branch"},verify:false});
let S=fresh();
let OPT={hints:true,speed:"fast",coachMin:false,coachList:false};
const SPEED={fast:{q:800,b:3500,d:3500},real:{q:4000,b:28000,d:22000}};

const U=()=>S.user||"user";
const R=()=>S.repo?S.repo.name:"repo";
const siteUrl=()=>`https://${U().toLowerCase()}.github.io/${R()}/`;
const ago=t=>{const s=Math.round((Date.now()-t)/1000);if(s<45)return "now";const m=Math.round(s/60);return m<60?`${m} minute${m>1?"s":""} ago`:`${Math.round(m/60)} hours ago`};
const fmtDur=ms=>{const s=Math.round(ms/1000);return s<60?`${s}s`:`${Math.floor(s/60)}m ${s%60}s`};
const fmtSize=n=>n<1024?`${n} Bytes`:n<1048576?`${(n/1024).toFixed(1)} KB`:`${(n/1048576).toFixed(1)} MB`;

let toastT;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2000)}

const KEY=(u,p)=>`ghsim:${u.toLowerCase()}:${p}`;
function load(u,p){try{const v=localStorage.getItem(KEY(u,p));return v?JSON.parse(v):null}catch(e){return null}}
let saveT;function save(){if(!S.user||!S.pin)return;clearTimeout(saveT);saveT=setTimeout(()=>{const o={...S,menu:null,flash:null,fd:null};
 try{localStorage.setItem(KEY(S.user,S.pin),JSON.stringify(o))}catch(e){try{const lite=JSON.parse(JSON.stringify(o));if(lite.repo){lite.repo.files.forEach(f=>{if(f.dataUrl)f.dataUrl=""});lite.repo.runs.forEach(r=>r.snapshot.forEach(f=>{if(f.dataUrl)f.dataUrl=""}))}localStorage.setItem(KEY(S.user,S.pin),JSON.stringify(lite))}catch(_){}}},300)}
function wipe(){try{if(S.user&&S.pin)localStorage.removeItem(KEY(S.user,S.pin))}catch(e){}}
/* ---------------- runs ---------------- */
function runStatus(r){const t=Date.now()-r.start,d=r.d;if(t<d.q)return "queued";if(t<d.q+d.b)return "build";if(t<d.q+d.b+d.d)return "deploy";return "success"}
function newRun(msg){const R0=S.repo;S.runSeq++;const r={id:1000+S.runSeq*7,num:S.runSeq,start:Date.now(),msg,by:U(),d:{...SPEED[OPT.speed]},folder:R0.pages.folder,snapshot:R0.files.map(f=>({...f}))};R0.runs.unshift(r);return r}
function liveRun(){return S.repo?S.repo.runs.find(r=>runStatus(r)==="success"):null}
function activeRun(){return S.repo?S.repo.runs.find(r=>runStatus(r)!=="success"):null}
function pagesOn(){return S.repo&&S.repo.pages.branch==="main"}
function hasRootIndex(){return S.repo&&S.repo.files.some(f=>f.name==="index.html")}

/* ---------------- navigation ---------------- */
function nav(screen,opts={}){if(S.screen!==screen&&!opts.noPush)S.hist.push(S.screen);S.screen=screen;S.menu=null;if(opts.flash!==undefined)S.flash=opts.flash;else S.flash=null;render();window.scrollTo(0,0)}
function back(){if(!S.hist.length)return;S.screen=S.hist.pop();S.menu=null;S.flash=null;render()}

function diffHTML(n){const a=A(),f=a.work[n];if(f.dataUrl)return `<div class="dhd mono">${esc(n)}</div><div style="padding:24px;display:grid;place-items:center"><img src="${f.dataUrl}" alt="" style="max-height:320px;border:1px solid var(--line)"></div>`;
 const lines=(f.content||"").split("\n"),old=a.files[n]?(a.files[n].content||"").split("\n"):null;
 return `<div class="dhd mono">${esc(n)}</div><div class="diff">${old?`<div class="ln hunk"><i></i><span>@@ 수정된 파일 · 이전 ${old.length}줄 → ${lines.length}줄 @@</span></div>`:""}${lines.slice(0,300).map((l,i)=>`<div class="ln"><i>${i+1}</i><span>+${esc(l)}</span></div>`).join("")}${lines.length>300?`<div class="ln"><i></i><span>… ${lines.length-300} more lines</span></div>`:""}</div>`}
function blankHTML(){const a=A();return `<div class="blank"><h2 class="h2" style="font-weight:400">No local changes</h2><p class="muted" style="margin:0">There are no uncommitted changes in this repository. Here are some friendly suggestions for what to do next.</p>
 ${!a.published?`<div class="sug prim"><div><b>Publish your repository to GitHub</b><div class="muted" style="font-size:13px">This repository is currently only available on your local machine. By publishing it on GitHub you can share it, and collaborate with others.</div></div><button class="btn" style="background:#0969da;color:#fff;border-color:#0969da" data-act="a-publish">Publish repository</button></div>`:a.ahead>0?`<div class="sug prim"><div><b>Push commits to the origin remote</b><div class="muted" style="font-size:13px">You have ${a.ahead} local commit${a.ahead>1?"s":""} waiting to be pushed to GitHub.</div></div><button class="btn" style="background:#0969da;color:#fff;border-color:#0969da" data-act="a-push">Push origin</button></div>`:""}
 <div class="sug"><div><b>View the files of your repository in Explorer</b><div class="muted" style="font-size:13px">Repository menu or Ctrl + Shift + F</div></div><button class="btn" data-act="a-explorer" data-coach="a-explorer">Show in Explorer</button></div>
 ${a.published?`<div class="sug"><div><b>Open the repository page on GitHub in your browser</b><div class="muted" style="font-size:13px">Repository menu or Ctrl + Shift + G</div></div><button class="btn" data-act="a-viewgh" data-coach="a-viewgh">View on GitHub</button></div>`:""}
 <div class="sug"><div><b>Open the repository in your external editor</b><div class="muted" style="font-size:13px">Repository menu or Ctrl + Shift + A</div></div><button class="btn" disabled>Open in Visual Studio Code</button></div></div>`}
function explorerModal(){const a=A();const local=Object.keys(a.work).sort();
 $("#layer").innerHTML=`<div class="scrim"><div class="xwin"><div class="wtitle" style="background:#f3f3f3;color:#1f2328;border-bottom:1px solid #ddd">${AICO.folder}<b style="font-weight:600">파일 탐색기</b><span class="pill" style="font-family:var(--f-kr)">연습용</span><span class="wctl"><i data-act="a-xclose" style="cursor:pointer;font-size:16px">×</i></span></div>
 <div class="xgrid"><div class="xp"><div class="xh">${AICO.folder} 다운로드</div>
   <div class="xl">${a.dl.map((f,i)=>`<div class="xf" draggable="true" data-dl="${i}">${AICO.html}<span>${esc(f.name)}</span><button class="btn sm" data-act="a-copy:${i}" ${f.name==="index.html"?'data-coach="a-copy"':""}>복사 →</button></div>`).join("")}</div>
   <div style="display:flex;gap:6px;flex-wrap:wrap;padding:8px"><button class="hbtn ghost" data-act="a-pick">내 컴퓨터에서 실제 파일 찾기</button></div></div>
  <div class="xp" id="xdrop"><div class="xh">${AICO.folder} 문서 › GitHub › <b>${esc(a.name)}</b></div>
   <div class="xl">${local.length?local.map(n=>`<div class="xf">${AICO.html}<span>${esc(n)}</span></div>`).join(""):'<div class="muted" style="padding:20px;text-align:center;font-family:var(--f-kr)">빈 폴더. 왼쪽 파일을 끌어다 놓기</div>'}</div></div></div>
 <div class="df" style="font-family:var(--f-kr)"><span class="muted" style="font-size:13px;flex:1">이 폴더에 넣은 파일을 앱이 Changes로 보여 줌</span><button class="btn" data-act="a-xclose">닫기</button></div></div></div>`;
 document.querySelectorAll(".xf[data-dl]").forEach(el=>el.addEventListener("dragstart",e=>{try{e.dataTransfer.setData("text/plain",el.dataset.dl)}catch(_){}}));
 const xd=$("#xdrop");xd.addEventListener("dragover",e=>{e.preventDefault();xd.classList.add("over")});xd.addEventListener("dragleave",()=>xd.classList.remove("over"));
 xd.addEventListener("drop",e=>{e.preventDefault();xd.classList.remove("over");const i=e.dataTransfer.getData("text/plain");if(i!=="")copyDl(+i);else if(e.dataTransfer.files.length)readInto(e.dataTransfer.files,true)});
 placeHot(appHint());
}
function copyDl(i){const a=A(),f=a.dl[i];if(!f)return;a.work[f.name]={name:f.name,size:f.size,content:f.content,dataUrl:f.dataUrl};toast(`${f.name} 복사`);explorerModal();render()}
function readInto(list,toRepo){const arr=[...list];let n=0;arr.forEach(f=>{const rd=new FileReader();const isText=/\.(html?|css|js|json|txt|md|svg|csv)$/i.test(f.name)||/^text\//.test(f.type);
 rd.onload=()=>{const o={name:f.name,size:f.size};if(isText)o.content=rd.result;else o.dataUrl=rd.result;const a=A();a.dl=a.dl.filter(x=>x.name!==f.name);a.dl.unshift(o);if(toRepo)a.work[f.name]={...o};
  if(++n===arr.length){if(a.explorer)explorerModal();render();toast(toRepo?"저장소 폴더에 복사":`${arr.length}개 파일 불러옴`)}};isText?rd.readAsText(f):rd.readAsDataURL(f)})}
function publishModal(){const a=A();const p=a.pub;
 $("#layer").innerHTML=`<div class="scrim"><div class="modal"><div class="mh" style="display:flex;justify-content:space-between">Publish repository<button data-act="a-pubclose">${ico.x}</button></div>
 <div class="mb"><div style="display:flex;gap:16px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600"><span style="border-bottom:2px solid #0969da;padding-bottom:6px">GitHub.com</span><span class="muted">GitHub Enterprise</span></div>
 <div><label class="lbl" for="pb-name">Name</label><input class="in" id="pb-name" value="${esc(p.name)}"></div>
 <div><label class="lbl" for="pb-desc">Description</label><input class="in" id="pb-desc" value="${esc(p.desc)}"></div>
 <label class="radio" data-coach="a-private" style="padding:6px 8px"><input type="checkbox" id="pb-priv" ${p.priv?"checked":""}><span>Keep this code private</span></label>
 <div><label class="lbl">Organization</label><span class="sel">None ${ico.caret}</span></div>
 <div class="err" id="pb-err" ${p.err?"":"hidden"}>${esc(p.err||"")}</div></div>
 <div class="mf"><button class="btn" data-act="a-pubclose">Cancel</button><button class="btn" style="background:#0969da;color:#fff;border-color:#0969da" data-act="a-pub-go" data-coach="a-pub-go">Publish repository</button></div></div></div>`;
 $("#pb-priv").addEventListener("change",e=>{a.pub.priv=e.target.checked;renderCoach()});
 $("#pb-name").addEventListener("input",e=>a.pub.name=e.target.value);$("#pb-desc").addEventListener("input",e=>a.pub.desc=e.target.value);
 placeHot(appHint());
}
function bindApp(){const a=A();
 const n=$("#a-rname");if(n){n.addEventListener("input",()=>{a.name=n.value;const nm=normName(n.value);$("#a-createbtn").disabled=!nm;$("#a-rmsg").innerHTML=n.value.trim()&&nm!==n.value.trim()?`<div class="note" style="color:var(--yellow)">Will be created as ${esc(nm)}</div>`:"";renderCoach()});
  $("#a-rdesc").addEventListener("input",e=>a.desc=e.target.value);$("#a-readme").addEventListener("change",e=>a.readme=e.target.checked)}
 const sm=$("#a-sum");if(sm){sm.addEventListener("input",()=>{a.summary=sm.value;$("#a-commit").disabled=!(changes().length&&sm.value.trim());renderCoach()});$("#a-desc").addEventListener("input",e=>a.cdesc=e.target.value)}
 const au=$("#a-user");if(au)au.addEventListener("input",()=>renderCoach());
}
function appAct(k,v){const a=A();
 switch(k){
  case "a-menu":S.menu=S.menu==="a-repo"?null:"a-repo";render();break;
  case "a-signin":a.stage="signin";render();break;
  case "a-skip":toast("연습에서는 로그인 필요");break;
  case "a-cancel":a.stage="welcome";render();break;
  case "a-authorize":{if(!S.loggedIn){const u=($("#a-user").value||"").trim(),p=($("#a-pin").value||"").trim(),er=$("#a-err");
    if(!/^[A-Za-z0-9](?:[A-Za-z0-9]|-(?=[A-Za-z0-9])){0,38}$/.test(u)){er.hidden=false;er.textContent="아이디: 영문·숫자·하이픈";return}
    if(!/^\d{4,8}$/.test(p)){er.hidden=false;er.textContent="나만 아는 번호: 숫자 4~8자리";return}
    S.user=u;S.pin=p;S.loggedIn=true}
   a.signed=true;a.stage="config";render();toast("앱 로그인 완료");break}
  case "a-back":a.stage=v;render();break;
  case "a-finish":a.git={name:$("#a-gname").value,email:$("#a-gmail").value};a.stage="start";render();break;
  case "a-new":a.stage="create";render();break;
  case "a-create":{const nm=normName(a.name);if(!nm)return;a.name=nm;a.stage="main";a.files={};a.work={};a.commits=[];
   if(a.readme){const f={name:"README.md",size:nm.length+2,content:`# ${nm}\n${a.desc||""}`};a.files["README.md"]={...f};a.work["README.md"]={...f};a.commits.push({msg:"Initial commit",time:Date.now(),files:["README.md"],pushed:false})}
   if(!a.dl.length)a.dl=[{name:"index.html",size:new Blob([SAMPLE]).size,content:SAMPLE}];render();toast("로컬 저장소 생성");break}
  case "a-tab":a.tab=v;render();break;
  case "a-sel":a.sel=v;render();break;
  case "a-commit":{const ch=changes();if(!ch.length||!a.summary.trim())return;ch.forEach(n=>a.files[n]={...a.work[n]});a.commits.unshift({msg:a.summary.trim(),time:Date.now(),files:ch,pushed:false});if(a.published)a.ahead++;a.summary="";a.cdesc="";render();toast(`커밋 완료 · ${ch.length}개 파일`);break}
  case "a-explorer":S.menu=null;if(!a.dl.length)a.dl=[{name:"index.html",size:new Blob([SAMPLE]).size,content:SAMPLE}];a.explorer=true;explorerModal();renderCoach();break;
  case "a-xclose":a.explorer=false;closeModal();render();break;
  case "a-copy":copyDl(+v);break;
  case "a-pick":$("#a-picker").click();break;
  case "a-dlbad":a.dl.push({name:"index (1).html",size:new Blob([SAMPLE]).size,content:SAMPLE});explorerModal();break;
  case "a-publish":if(!a.commits.length){toast("먼저 커밋 필요");return}a.pub={name:a.name,desc:a.desc,priv:true,err:""};publishModal();renderCoach();break;
  case "a-pubclose":a.pub=null;closeModal();render();break;
  case "a-pub-go":{const p=a.pub,nm=normName(p.name);if(!nm){p.err="Name is required";publishModal();return}
   if(S.repo){p.err=S.repo.name===nm?`Name already exists on this account`:"연습에서는 저장소 1개만 사용. 위쪽 초기화 후 진행";publishModal();return}
   const t=Date.now();S.repo={name:nm,desc:p.desc.trim(),vis:p.priv?"private":"public",files:[],commits:[],runs:[],pages:{branch:null,folder:"/"}};
   a.commits.slice().reverse().forEach(c=>{c.pushed=true;S.repo.commits.unshift({msg:c.msg,time:c.time});c.files.forEach(n=>{const f=a.files[n];S.repo.files=S.repo.files.filter(x=>x.name!==n);S.repo.files.push({...f,commit:c.msg,time:c.time})})});
   a.name=nm;a.published=true;a.ahead=0;a.pub=null;S.draft={branch:null,folder:"/",source:"branch"};closeModal();render();toast(p.priv?"Private 저장소로 게시됨":"GitHub.com에 게시 완료");break}
  case "a-push":{if(!a.published||!a.ahead)return;const pend=a.commits.filter(c=>!c.pushed).reverse();let last="";
   pend.forEach(c=>{c.pushed=true;last=c.msg;S.repo.commits.unshift({msg:c.msg,time:c.time});c.files.forEach(n=>{const f=a.files[n];S.repo.files=S.repo.files.filter(x=>x.name!==n);S.repo.files.push({...f,commit:c.msg,time:c.time})})});
   a.ahead=0;let msg="Push 완료";if(pagesOn()&&S.repo.vis==="public"){newRun(last);msg="Push 완료 · Pages 재배포 시작"}render();toast(msg);break}
  case "a-fetch":toast("최신 상태");break;
  case "a-viewgh":S.menu=null;if(!S.repo){toast("먼저 Publish repository");return}S.loggedIn=true;S.view="sim";S.hist=[];S.screen="repo";S.flash=null;render();window.scrollTo(0,0);break;
 }
}

/* view mode: auto / pc / mob */
let VMODE="auto";
function setMode(m){VMODE=m;document.body.classList.toggle("desk",m==="pc");document.body.classList.toggle("mob",m==="mob");$("#pb-pc").classList.toggle("on",m==="pc");$("#pb-mob").classList.toggle("on",m==="mob");
 try{localStorage.setItem("ghsim:mode",m)}catch(e){}fitDesk();if(m!=="auto"&&S.view!=="sim"&&S.view!=="app"){S.view="sim";render()}else render()}
/* desktop mode */
function fitDesk(){const z=Math.min(1,document.documentElement.clientWidth/1280);$("#stage").style.setProperty("--z",z);if(S.view==="sim"||S.view==="app")requestAnimationFrame(()=>placeHot(S.view==="app"?appHint():hint()))}
addEventListener("resize",fitDesk);
try{const m=localStorage.getItem("ghsim:mode");if(m==="pc"||m==="mob")setTimeout(()=>setMode(m),0)}catch(e){}
/* ticker */
let sig="";
function signature(){const r=S.repo;return r?r.runs.map(x=>runStatus(x)).join(",")+"|"+Math.floor(Date.now()/30000):""}
setInterval(()=>{if(!S.repo||S.view!=="sim")return;const s=signature();if(s!==sig){const was=sig;sig=s;
 if(["actions","run","pages","repo"].includes(S.screen)&&!document.activeElement.matches("input,textarea"))render();else renderCoach();
 if(was&&/success$/.test(s.split("|")[0])&&!/success$/.test(was.split("|")[0]))toast("배포 완료")}},400);

render();
})();
</script>

</body></html>
